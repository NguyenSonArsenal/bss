<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra cứu tần suất từ vựng</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; }
        .container { max-width: 600px; margin: 0 auto; }
        input { padding: 10px; width: 300px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        .result { margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Tra cứu từ vựng (100 GB Data)</h2>
    <input type="text" id="keyword" placeholder="Nhập từ cần tìm...">
    <button onclick="startSearch()">Search</button>

    <div class="result" id="resultBox" style="display:none;">
        <p><strong>Trạng thái:</strong> <span id="status">Đang xử lý...</span></p>
        <p><strong>Số file đã quét:</strong> <span id="filesCount">0</span> / 100</p>
        <p><strong>Số lần xuất hiện:</strong> <span id="wordCount">0</span></p>
    </div>
</div>

<script>
    let eventSource = null;

    function startSearch() {
        const keyword = document.getElementById('keyword').value;
        const resultBox = document.getElementById('resultBox');
        const statusEl = document.getElementById('status');
        const filesCountEl = document.getElementById('filesCount');
        const wordCountEl = document.getElementById('wordCount');

        if (!keyword) {
            alert('Vui lòng nhập từ khóa!');
            return;
        }

        // Reset hiển thị
        resultBox.style.display = 'block';
        statusEl.innerText = 'Đang quét dữ liệu...';
        filesCountEl.innerText = '0';
        wordCountEl.innerText = '0';

        // Đóng kết nối cũ nếu có
        if (eventSource) eventSource.close();

        // Khởi tạo EventSource để kết nối tới Server-Sent Events
        eventSource = new EventSource(`/search?keyword=${encodeURIComponent(keyword)}`);

        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);

            filesCountEl.innerText = data.filesProcessed;
            wordCountEl.innerText = data.count;

            if (data.status === 'done') {
                statusEl.innerText = 'Tìm kiếm hoàn tất!';
                eventSource.close();
            } else if (data.status === 'error') {
                statusEl.innerText = 'Đã xảy ra lỗi!';
                eventSource.close();
            }
        };

        eventSource.onerror = function() {
            statusEl.innerText = 'Kết nối bị gián đoạn hoặc hoàn tất.';
            eventSource.close();
        };
    }
</script>

</body>
</html>
